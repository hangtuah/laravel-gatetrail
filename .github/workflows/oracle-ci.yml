name: Oracle compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/oracle-ci.yml'
      - 'composer.json'
      - 'config/gatetrail.php'
      - 'database/ddl/oracle/**'
      - 'database/migrations/**'
      - 'phpunit.oracle.xml'
      - 'src/Database/Migrations/**'
      - 'src/Database/Schema/**'
      - 'tests/Database/Oracle*.php'
      - 'tests/Integration/Oracle/**/*.php'
      - 'tools/oracle-integration/**'
      # Resolver surface. The live Oracle lane is the only place the snapshot
      # queries meet a real Oracle DATE column, OCI8 result mapping and a
      # schema-qualified installation, so a change to any of these can break
      # Oracle without breaking SQLite. Kept to the resolver's own reach rather
      # than all of src/, because this workflow provisions a database.
      - 'src/Access/**'
      - 'src/Contracts/PermissionResolver.php'
      - 'src/Contracts/RoleResolver.php'
      - 'src/Diagnostics/**'
      - 'src/GateTrailServiceProvider.php'
      - 'src/Guards/**'
      - 'src/Models/**'
      - 'src/PermissionReference.php'
      - 'src/RoleReference.php'
      - 'src/Subjects/**'
      # The shared cross-engine acceptance fixture and assertions. Oracle
      # compares against the same expectation SQLite produced, so a change here
      # changes what Oracle is asked.
      - 'tests/Integration/Concerns/**'
      - 'tests/Integration/Support/**'

permissions:
  contents: read

concurrency:
  group: oracle-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-compatibility:
    name: Laravel 12 and 13 / Oracle Free 23.26.1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GATETRAIL_ORACLE_HOST: 127.0.0.1
      GATETRAIL_ORACLE_PORT: 1521
      GATETRAIL_ORACLE_SERVICE: FREEPDB1
      GATETRAIL_ORACLE_USERNAME: gatetrail
      GATETRAIL_ORACLE_PASSWORD: gatetrail_test

    services:
      oracle:
        image: gvenzl/oracle-free:23.26.1-slim-faststart
        env:
          ORACLE_PASSWORD: gatetrail_root_test
          APP_USER: gatetrail
          APP_USER_PASSWORD: gatetrail_test
        ports:
          - 1521:1521
        options: >-
          --health-cmd=healthcheck.sh
          --health-interval=5s
          --health-timeout=5s
          --health-retries=60
          --health-start-period=60s
          --shm-size=1g

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP with OCI8
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: oci8
          coverage: none
        env:
          fail-fast: true

      - name: Confirm OCI8
        run: php --ri oci8

      - name: Install Laravel 13 reference dependencies
        run: >
          composer install
          --working-dir=tools/oracle-integration
          --no-interaction
          --no-progress

      # Both lanes run, and both results are visible, even when the first
      # fails: `continue-on-error` records the outcome without stopping the
      # job, and the gate step below turns either failure into a job failure.
      # A hard failure here would otherwise hide whether the other lane was
      # healthy, on a workflow that is deliberately run rarely.
      - name: Lane A — Laravel 13 / Testbench 11 / OCI8 13 / Oracle Free 23.26.1
        id: laravel-13
        continue-on-error: true
        run: composer test:oracle

      - name: Prepare Laravel 12 compatibility checkout
        run: |
          git clone --no-hardlinks "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/gatetrail-laravel-12"
          composer require \
            --working-dir="$RUNNER_TEMP/gatetrail-laravel-12/tools/oracle-integration" \
            "orchestra/testbench:^10.0" \
            "yajra/laravel-oci8:^12.0" \
            --with-all-dependencies \
            --no-interaction \
            --no-progress

      - name: Lane B — Laravel 12 / Testbench 10 / OCI8 12 / Oracle Free 23.26.1
        id: laravel-12
        continue-on-error: true
        working-directory: ${{ runner.temp }}/gatetrail-laravel-12
        run: composer test:oracle

      - name: Both Oracle lanes must pass
        run: |
          echo "Laravel 13 / OCI8 13: ${{ steps.laravel-13.outcome }}"
          echo "Laravel 12 / OCI8 12: ${{ steps.laravel-12.outcome }}"
          test "${{ steps.laravel-13.outcome }}" = "success" \
            && test "${{ steps.laravel-12.outcome }}" = "success"
